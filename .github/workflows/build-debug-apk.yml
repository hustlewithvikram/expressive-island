name: Build Debug APK (Signed)

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expressive-island-debug
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.EXPRESSIVE_DEBUG_STORE_FILE }}
          DEBUG_STORE_PASSWORD: ${{ secrets.EXPRESSIVE_DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.EXPRESSIVE_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.EXPRESSIVE_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DEBUG_KEYSTORE_BASE64 DEBUG_STORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required debug signing secret is missing: $name."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/expressive-island-debug.jks"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "EXPRESSIVE_DEBUG_STORE_FILE=$KEYSTORE_PATH"
            echo "EXPRESSIVE_DEBUG_STORE_PASSWORD=$DEBUG_STORE_PASSWORD"
            echo "EXPRESSIVE_DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
            echo "EXPRESSIVE_DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --no-daemon

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/debug/*.apk)
          if [[ ${#APK_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one debug APK, found ${#APK_FILES[@]}."
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/debug-artifact"
          cp "${APK_FILES[0]}" "$RUNNER_TEMP/debug-artifact/expressive-island-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/debug-artifact/expressive-island-debug.apk"
          echo "apk_path=$RUNNER_TEMP/debug-artifact/expressive-island-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expressive-island-debug
          path: ${{ runner.temp }}/debug-artifact/expressive-island-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish or update rolling debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="expressive-island-debug-latest-build"
          SHORT_SHA="$(git rev-parse --short=8 "$GITHUB_SHA")"
          BRANCH="$GITHUB_REF_NAME"
          TITLE="Expressive Island Debug — Build #${GITHUB_RUN_NUMBER} (${BRANCH} · ${SHORT_SHA})"
          COMMIT_SUBJECT="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          NOTES="$(cat <<EOF
          **Latest signed debug build** for the \`${BRANCH}\` branch.

          - **Build:** #${GITHUB_RUN_NUMBER}
          - **Run ID:** ${GITHUB_RUN_ID}
          - **Branch:** \`${BRANCH}\`
          - **Commit:** [\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - **Commit message:** ${COMMIT_SUBJECT}
          - **Workflow run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This prerelease is a rolling channel: each successful run replaces the APK attached to this release with the newest signed debug build.
          EOF
          )"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH#expressive-island-debug.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git push origin ":refs/tags/$TAG"
            fi
            gh release create "$TAG" "$APK_PATH#expressive-island-debug.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/expressive-island-debug.jks"
