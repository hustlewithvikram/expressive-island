name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing version tag to publish (for example v0.1.6)"
        required: true
        type: string
      apk_url:
        description: "Download URL of the already-built signed release APK"
        required: true
        type: string
      aab_url:
        description: "Download URL of the already-built signed Play Store AAB"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: expressive-island-publish-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Attach tested APK and AAB to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate tag and download URLs
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          APK_URL: ${{ inputs.apk_url }}
          AAB_URL: ${{ inputs.aab_url }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version tag: $TAG_NAME"
            exit 1
          fi
          for url in "$APK_URL" "$AAB_URL"; do
            if [[ "$url" != https://* ]]; then
              echo "::error::Artifact URLs must use HTTPS."
              exit 1
            fi
          done

      - name: Download already-built release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_URL: ${{ inputs.apk_url }}
          AAB_URL: ${{ inputs.aab_url }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl --fail --location --silent --show-error "$APK_URL" --output release-assets/expressive-island-release.apk
          curl --fail --location --silent --show-error "$AAB_URL" --output release-assets/expressive-island-release.aab
          test -s release-assets/expressive-island-release.apk
          test -s release-assets/expressive-island-release.aab

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose release-assets/expressive-island-release.apk
          jarsigner -verify release-assets/expressive-island-release.aab

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Expressive Island ${{ inputs.tag_name }}
          generate_release_notes: true
          files: |
            release-assets/expressive-island-release.apk
            release-assets/expressive-island-release.aab
          fail_on_unmatched_files: true
          prerelease: false
