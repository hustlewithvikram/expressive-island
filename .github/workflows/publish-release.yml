name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: expressive-island-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.EXPRESSIVE_RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.EXPRESSIVE_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.EXPRESSIVE_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.EXPRESSIVE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required release signing secret is missing: $name."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/expressive-island-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "EXPRESSIVE_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "EXPRESSIVE_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "EXPRESSIVE_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "EXPRESSIVE_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease --build-cache --parallel --no-daemon

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/release/*.apk)
          AAB_FILES=(app/build/outputs/bundle/release/*.aab)
          if [[ ${#APK_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#APK_FILES[@]}."
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi
          if [[ ${#AAB_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one release AAB, found ${#AAB_FILES[@]}."
            printf '%s\n' "${AAB_FILES[@]}"
            exit 1
          fi

          mkdir -p release-assets
          cp "${APK_FILES[0]}" release-assets/expressive-island-release.apk
          cp "${AAB_FILES[0]}" release-assets/expressive-island-release.aab

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose release-assets/expressive-island-release.apk
          jarsigner -verify release-assets/expressive-island-release.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Expressive Island ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/expressive-island-release.apk
            release-assets/expressive-island-release.aab
          fail_on_unmatched_files: true
          prerelease: false

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/expressive-island-release.jks"
