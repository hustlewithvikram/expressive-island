name: Build

on:
  push:
    branches:
      - main
      - feat/multi-persistent-tiles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expressive-island-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK and run lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and cache dependencies
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.EXPRESSIVE_RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.EXPRESSIVE_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.EXPRESSIVE_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.EXPRESSIVE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required release signing secret is missing: $name."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/expressive-island-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          {
            echo "EXPRESSIVE_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "EXPRESSIVE_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "EXPRESSIVE_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "EXPRESSIVE_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --build-cache --parallel --no-daemon

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/release/*.apk)

          if [[ ${#APK_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#APK_FILES[@]}."
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "${APK_FILES[0]}" "$RUNNER_TEMP/release-artifact/expressive-island-release.apk"
          test -s "$RUNNER_TEMP/release-artifact/expressive-island-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: expressive-island-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact/expressive-island-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android lint
        if: always()
        run: ./gradlew lintDebug --build-cache --parallel --no-daemon

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/expressive-island-release.jks"
